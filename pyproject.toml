[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webtoon-fr"
version = "1.0.1"
description = "Traduction de webtoons et de manhwa de l'anglais vers le français"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pillow>=10.3",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "rapidocr>=3.0",
  "onnxruntime>=1.17",
  "pyphen>=0.15",
  "fonttools>=4.50",
  "anthropic>=0.40",
  "truststore>=0.9",
]

[project.optional-dependencies]
navigateur = ["playwright>=1.44"]
rtdetr = ["torch>=2.2", "transformers>=4.45"]

[project.scripts]
webtoon-fr = "webtoon_fr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webtoon_fr = ["web/static/*"]
